name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build & test (unsigned)
        run: |
          xcodebuild -project FlightDesk.xcodeproj -scheme FlightDesk -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO DEVELOPMENT_TEAM=CI0000000 build test
      - name: Build the iPhone app (unsigned)
        run: |
          xcodebuild -project FlightDesk.xcodeproj -scheme FlightDeskiOS -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO DEVELOPMENT_TEAM=CI0000000 build
