# nginx site for the FlightDesk server.
# deploy.sh --nginx DOMAIN installs this as /etc/nginx/sites-available/flightdesk-server.conf
# (only if that file doesn't exist yet) with __DOMAIN__ replaced, enables it, runs nginx -t and
# reloads. It never touches other sites. Then add TLS with:
#   sudo certbot --nginx -d __DOMAIN__ --redirect
# Don't put the token in the apps until https:// works: over plain http it travels in clear text.

# Requests carry the device's position in the query string: log the path only.
log_format flightdesk_noquery '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                              '$status $body_bytes_sent $request_time';

upstream flightdesk_server {
    server 127.0.0.1:8787;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    access_log /var/log/nginx/flightdesk.access.log flightdesk_noquery;
    error_log  /var/log/nginx/flightdesk.error.log warn;

    # The API takes no request bodies (POST /v1/watch/{hex} is empty).
    client_max_body_size 4k;
    client_body_timeout   10s;
    client_header_timeout 10s;
    keepalive_timeout     65s;
    server_tokens off;

    location / {
        proxy_pass http://flightdesk_server;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # gzip passthrough: the server already gzips JSON when the client accepts it. nginx
        # forwards Accept-Encoding and the compressed body untouched; don't compress twice.
        gzip off;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    60s;
        proxy_buffering on;
        proxy_buffers 16 16k;
    }
}
