name: FlightDesk
options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    PROVISIONING_PROFILE_SPECIFIER: ""
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
targets:
  FlightDesk:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes: ["AppIcon.icon/**"]
      - path: App/AppIcon.icon
        buildPhase: resources
      - path: Config/Privacy/App/PrivacyInfo.xcprivacy
        buildPhase: resources
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).flightdesk
        CODE_SIGN_ENTITLEMENTS: Config/App.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: FlightDesk
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Simon Degnan. MIT License."
        INFOPLIST_KEY_NSLocationUsageDescription: FlightDesk uses your location to show aircraft flying near you.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: FlightDesk uses your location to show aircraft flying near you.
        INFOPLIST_FILE: Config/App-Info.plist
    dependencies:
      - target: FlightDeskWidget
  FlightDeskWidget:
    type: app-extension
    platform: macOS
    sources:
      - Widget
      - Shared
      - path: Config/Privacy/Widget/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).flightdesk.widget
        CODE_SIGN_ENTITLEMENTS: Config/Widget.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: FlightDesk
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Simon Degnan. MIT License."
        INFOPLIST_FILE: Config/Widget-Info.plist
  FlightDeskTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).flightdesk.tests
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_HARDENED_RUNTIME: NO
schemes:
  FlightDesk:
    build:
      targets:
        FlightDesk: all
    test:
      targets: [FlightDeskTests]
