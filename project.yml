name: FlightDesk
options:
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    PROVISIONING_PROFILE_SPECIFIER: ""
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
targets:
  FlightDesk:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes: ["AppIcon.icon/**"]
      - path: App/AppIcon.icon
        buildPhase: resources
      - path: Config/Privacy/App/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Shared
        excludes: ["Resources/**"]
      # Airport table for route checks, read lazily by AirportDB.
      - path: Shared/Resources/airports.csv
        buildPhase: resources
      # Runway thresholds for approach/landing detection, read lazily by RunwayDB.
      - path: Shared/Resources/runways.csv
        buildPhase: resources
      # Fixes and navaids for routes decoded from ACARS (detail view only, so not in the widget).
      - path: Shared/Resources/navdata.csv
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).flightdesk
        CODE_SIGN_ENTITLEMENTS: Config/App.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: FlightDesk
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Simon Degnan. MIT License."
        INFOPLIST_KEY_NSLocationUsageDescription: FlightDesk uses your location to show aircraft flying near you.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: FlightDesk uses your location to show aircraft flying near you.
        INFOPLIST_FILE: Config/App-Info.plist
    dependencies:
      - target: FlightDeskWidget
  FlightDeskWidget:
    type: app-extension
    platform: macOS
    sources:
      - Widget
      - path: Shared
        excludes: ["Resources/**"]
      # Airport table for route checks, read lazily by AirportDB.
      - path: Shared/Resources/airports.csv
        buildPhase: resources
      # Runway thresholds for approach/landing detection, read lazily by RunwayDB.
      - path: Shared/Resources/runways.csv
        buildPhase: resources
      - path: Config/Privacy/Widget/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).flightdesk.widget
        CODE_SIGN_ENTITLEMENTS: Config/Widget.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: FlightDesk
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Simon Degnan. MIT License."
        INFOPLIST_FILE: Config/Widget-Info.plist
  FlightDeskTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      - path: Shared
        excludes: ["Resources/**"]
      # Siri/Shortcuts wording, matching and entity mapping (these depend only on Shared).
      - path: App/Intents/FlightSpeech.swift
      - path: App/Intents/FlightEntity.swift
      - path: App/Intents/IntentFlights.swift
      # Airport table for route checks, read lazily by AirportDB.
      - path: Shared/Resources/airports.csv
        buildPhase: resources
      # Runway thresholds for approach/landing detection, read lazily by RunwayDB.
      - path: Shared/Resources/runways.csv
        buildPhase: resources
      - path: Shared/Resources/navdata.csv
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).flightdesk.tests
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_HARDENED_RUNTIME: NO
  # iPhone app: shares Shared/ and the cross-platform App/ views with the Mac app; the iPhone
  # layout lives in iOS/App.
  FlightDeskiOS:
    type: application
    platform: iOS
    sources:
      - path: iOS/App
      - path: iOS/Shared
      - path: App/AppIcon.icon
        buildPhase: resources
      - path: Config/Privacy/App/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Shared
        excludes: ["Resources/**"]
      - path: Shared/Resources/airports.csv
        buildPhase: resources
      - path: Shared/Resources/runways.csv
        buildPhase: resources
      - path: Shared/Resources/navdata.csv
        buildPhase: resources
      # Cross-platform App/ code (the rest of App/ is the AppKit shell).
      - path: App/LiveStore.swift
      - path: App/RadarModel.swift
      - path: App/FlightRowViews.swift
      - path: App/FlightDetailView.swift
      - path: App/SettingsView.swift
      - path: App/SpotterSettingsView.swift
      - path: App/SpotterAlerts.swift
      - path: App/SpottingLogStore.swift
      - path: App/LogbookView.swift
      - path: App/Intents
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).flightdesk.ios
        PRODUCT_NAME: FlightDesk
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_ENTITLEMENTS: Config/iOS-App.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/iOS-App-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: FlightDesk
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Simon Degnan. MIT License."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: FlightDesk uses your location to show aircraft flying near you.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ENABLE_HARDENED_RUNTIME: NO
    dependencies:
      - target: FlightDeskiOSWidget
  FlightDeskiOSWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: iOS/Widget
      - path: iOS/Shared
      - path: Shared
        excludes: ["Resources/**"]
      - path: Shared/Resources/airports.csv
        buildPhase: resources
      - path: Shared/Resources/runways.csv
        buildPhase: resources
      - path: Config/Privacy/Widget/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).flightdesk.ios.widget
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_ENTITLEMENTS: Config/iOS-Widget.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/iOS-Widget-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: FlightDesk
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Simon Degnan. MIT License."
        ENABLE_HARDENED_RUNTIME: NO
schemes:
  FlightDesk:
    build:
      targets:
        FlightDesk: all
    test:
      targets: [FlightDeskTests]
  FlightDeskiOS:
    build:
      targets:
        FlightDeskiOS: all
    run:
      config: Debug
